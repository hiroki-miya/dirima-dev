[project]
name = "dirima"
version = "0.1.0"
description = "Human-attention control plane for AI work"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "typer>=0.15,<1", "jsonschema>=4.23,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23", "testcontainers[postgres]>=4.10,<5"]
[project.scripts]
dirima = "dirima.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
[tool.mypy]
python_version = "3.13"
strict = true
packages = ["dirima"]
