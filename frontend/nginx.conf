server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_backend http://backend:8000;
  location /api/ { proxy_pass $api_backend; }
  location /healthz { proxy_pass $api_backend; }
  location /readyz { proxy_pass $api_backend; }
  location / { try_files $uri $uri/ /index.html; }
}
